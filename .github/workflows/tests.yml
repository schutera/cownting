name: tests

# Run the suite on every push and PR so regressions can't reach production the
# way the frame-sampling and DuckDB-concurrency bugs did (the container runs
# `serve --skip-tests`, and the tests aren't in the image — CI is the gate).
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # CPU-only torch from the PyTorch CPU wheel index (mirrors the Dockerfile,
      # avoids pulling the multi-GB CUDA build ultralytics would otherwise drag in).
      - name: Install CPU torch
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision

      - name: Install dependencies + test extras
        run: |
          pip install -r requirements.txt
          pip install "httpx>=0.27"          # fastapi TestClient needs httpx (test_api/test_auth)

      # The frontend carries logic the Python suite cannot see: the outline
      # editor's geometry and the rule deciding which box is ringed. Both
      # regressed silently during development — nothing threw, the screen just
      # showed the wrong thing — so they are gated here too.
      #
      # BUILT BEFORE the Python suite runs, deliberately. `frontend/dist` is
      # gitignored, and `test_path_safety`'s SPA traversal probes used to return
      # a green "not exercised" when it was missing — so on every CI run in that
      # gate's life, the traversal guard it exists to protect was never tested.
      # (The test now builds a throwaway dist of its own if there is none, so it
      # cannot silently skip again; this ordering means it runs against the real
      # one.)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      # `tsc --noEmit` and the bundler disagree: a path alias, an asset import or
      # a dependency that only resolves at bundle time typechecks clean and then
      # fails the Docker build, which nothing else here exercises.
      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run tests
        run: python -m tests
