project: cownting

# Start with a single camera. Add more entries later (camera_id is generic everywhere).
# For a time-lapse camera, set `start:` to the REAL capture start (e.g. the burned-in
# frame-0 clock) so timestamps land on the correct day and span the true duration.
cameras:
  - id: camera_01
    video: data/videos/camera_01.mp4
    start: "2026-06-01T08:00:00"   # ISO time of frame 0; omit to use the file's mtime

ingest:
  target_fps: 1.0                  # frames/sec sampled from the video (1-3 is plenty)
  time_bin_seconds: 2.0            # cross-camera alignment bin (matters once >1 camera)
  # Time-lapse only: seconds of REAL time between captured frames. When set, each frame's
  # ts = start + frame_idx * frame_interval_seconds (e.g. a Brinno at 1 frame/min -> 60).
  # Leave null for a normal real-time video (ts = start + frame_idx / video_fps).
  frame_interval_seconds: null
  save_frames: true                # write sampled frames to artifacts (needed for the seg view)

detect:
  backend: yolo                    # yolo | grounded_sam2
  device: auto                     # auto -> cuda | mps | cpu
  conf: 0.25
  # --- yolo backend ---
  yolo_weights: yolo11x-seg.pt     # auto-downloads on first use; runtime doesn't matter
  class_names: [cow]               # COCO classes to keep
  # --- grounded_sam2 backend (open-vocabulary zero-shot) ---
  dino_model_id: IDEA-Research/grounding-dino-tiny
  sam2_cfg: configs/sam2.1/sam2.1_hiera_s.yaml
  sam2_checkpoint: checkpoints/sam2.1_hiera_small.pt
  prompt: "cow."
  box_threshold: 0.3
  text_threshold: 0.25

posture:
  enabled: true
  lying_elongation: 1.9            # minAreaRect major/minor >= this => 'lying' (coarse proxy)

# --- Stage 1b: fine-tune / re-label loop (bootstrap -> CVAT correct -> train) ---
label:                             # `cownting label-select` + `label-export`
  workspace: data/labeling
  n_select: 150                    # frames to hand-correct in CVAT
  seed: 0
  bootstrap_backend: grounded_sam2 # open-vocab labeler that seeds the masks
  cvat_url: http://localhost:8080
  anno_key: cownting_stage1b       # FiftyOne annotation-run key (push + pull)
  label_field: cows

# --- In-app labeling: the Label page in the dashboard (docs/roadmap/M3_labeling.md) ---
# NOT the `label:` block above — that one is the Stage-1b CVAT round-trip. One word
# apart, two unrelated features: everything on the Label page is `annotation:`.
annotation:
  # How many DIFFERENT annotators should judge each instance. 2, not 1: at a target
  # of 1 the first submission drops the instance out of every other annotator's
  # queue, so nothing is ever judged twice and agreement can never be measured.
  targets_per_instance: 2
  # A slice of the instances gets a deeper target so Fleiss' kappa has a real rater
  # count somewhere. Membership is derived from the instance key itself, so every
  # annotator independently picks the same slice with zero coordination.
  overlap_fraction: 0.20
  overlap_targets: 3
  skip_retire: 3                   # distinct annotators who may skip an instance
                                   # before it stops being served to anyone
  batch_size: 8                    # instances handed out per queue fetch
  max_batch_size: 50               # ceiling on a client-requested batch size
  # Context around the cow, as a fraction of the LONGER bbox side. Sun exposure and
  # lying/standing are read off the surroundings, not off the animal, so a tight
  # crop is simply unanswerable.
  crop_pad: 0.35
  crop_max_width: 768              # crops are served square, at most this wide
  # A time-lapse camera burns the wall clock into the bottom ~4% of every frame, and
  # time of day is a direct hint at the sun-exposure answer — a visible banner hands
  # the annotator the answer and inflates agreement. Blank it before serving.
  mask_timestamp_banner: true
  # These cameras look down and the herd crosses the bottom of the frame, so a padded
  # crop of a low cow can be mostly banner. Above this share the crop is refused
  # rather than served as a grey rectangle: a featureless tile collects honest
  # "Cannot tell" answers about nothing, contaminating the statistic we're after.
  max_banner_fraction: 0.6
  max_note_chars: 500              # per-annotation free-text note cap
  # --- what is worth asking about ---
  # Measured over 1,164 served instances: only 43.8% produced a substantive
  # answer. The rest were 563 `low_resolution` flags plus 54 answers of
  # not_visible/cannot_tell — the same annotator minute, nothing learned.
  # P(substantive) by the animal's longer side in SOURCE pixels:
  #   <25px 13.6% | 25-35 26.3% | 35-45 29.8% | 45-60 35.1% | 60-90 46.4% | 90+ 76.0%
  min_instance_px: 25              # hard floor — never served below this
  clear_instance_px: 60            # at/above this, served FIRST
  # Yield keeps climbing as the floor rises (76% at 90px) and it is tempting to
  # cut there. Don't: a corpus of only near animals teaches the model nothing
  # about distant ones, which are exactly the ones the detector is worst at. So
  # smaller-but-not-hopeless crops are deprioritised rather than banned, and this
  # share of them is promoted into the front of the queue anyway.
  small_share: 0.15

# --- Weekly off-box backup of the annotation store ---
# data/labels.duckdb is the only state here a re-ingest cannot rebuild: frames,
# detections and overlays all come back, annotator hours do not. The job zips the
# store plus a CSV export, rotates locally, and (if COWNTING_DISCORD_WEBHOOK is set
# in the environment — never in this file) posts the zip to a Discord channel.
# Opt in deliberately: the first run has no watermark and so backs up and posts
# EVERYTHING, and the zip carries annotator usernames and per-annotator timings, so
# the channel it lands in has to be one chosen for that.
backup:
  enabled: false
  # A thread ticks every 15 min and asks "has this long passed since the last good
  # run?", so redeploys don't reset the clock the way a sleep(7 days) would.
  every_days: 7
  keep: 8                          # zips kept in <backups_dir>/labels/, pruned by name
  # Discord rejects (rather than truncates) an upload over ~10 MiB, so past this
  # budget the run degrades: full zip -> CSV-only zip -> a message naming the file it
  # kept on disk. All three still count as a run.
  max_upload_bytes: 9500000
  # --- Label-count milestones ---
  # A ping each time the labeled-instance count crosses a multiple of
  # `milestone_step`: 500, then 1000, then 1500. Announced once per level, and
  # only the highest is announced when several are crossed between two ticks.
  #
  # NOT gated on `enabled` above, and on by default: that switch governs whether
  # annotator names and timings leave the box inside a zip, while a milestone is
  # one integer, so a deployment can take the nudge without shipping the corpus.
  # Delivery is two-legged — an ASCII line on stdout that alerts/watch.py forwards
  # through the webhook it already holds, plus a direct post when
  # COWNTING_DISCORD_WEBHOOK is set. With neither configured it logs and posts
  # nothing, which is a supported state rather than a failure.
  #
  # The count is INSTANCES, not answers: targets_per_instance = 2 labels the same
  # animal twice on purpose, and counting rows would announce 1000 at 500 animals.
  # It is the same number the Label page's "Classes labeled" block totals to.
  milestones: true
  milestone_step: 500

# --- M5: the instance attribute model (docs/roadmap/M5_instance_attrs.md) ---
# A small crop classifier trained on the Label page's answers. Three heads:
# is-this-a-cow (gates the segmenter's false positives), sun exposure, behaviour.
#
#   cownting attrs build-dataset     labels + frames -> crops + manifest
#   cownting attrs train             fine-tune; prints the per-head val report
#   POST /api/attrs/score            score `detections` IN THE SERVER PROCESS
#
# The two CLI steps are OFFLINE — they take a DuckDB write handle, and DuckDB
# allows one read-write process per file, so running them against a live server
# takes the site off the air rather than merely slowing it. Scoring has an API
# route for exactly that reason; use it on a deployment.
instance_attrs:
  dataset_dir: data/instance_attrs/dataset
  weights: data/models/instance_attrs.pt
  device: auto                     # cuda > mps > cpu; train on a GPU box, serve on CPU
  # Split. The unit is a contiguous run of frames from ONE camera on ONE day —
  # at ingest.frame_interval_seconds = 60 these are minutes, so 30 is a
  # half-hour block. Cows barely move minute-to-minute, so a per-instance split
  # would put near-duplicate crops on both sides and score memorisation.
  block_frames: 30
  val_fraction: 0.2
  split_seed: 1337
  img_size: 224
  epochs: 50
  batch_size: 32
  lr: 0.0003
  weight_decay: 0.0001
  patience: 10                     # early-stops on mean macro-F1, not accuracy
  num_workers: 0
  seed: 1337
  # --- the recipe. Chosen by `cownting attrs cv` (5-fold grouped CV), and that
  # is what should decide any change here: one train/val split's noise is
  # ±0.014, so a single run cannot tell a 0.01 gain from nothing.
  backbone: resnet18      # mobilenet_v3_small|mobilenet_v3_large|efficientnet_b0|resnet18
  weight_power: 0.5                # class weights = inverse-frequency ** this
  label_smoothing: 0.1
  ema_decay: 0.998                 # halves the gate's fold-to-fold spread
  warmup_epochs: 2
  head_lr_mult: 5.0
  # Augmentation — the one change that measurably helped (+0.010 pooled, and
  # gate F1 on 25–60px crops 0.77 -> 0.81). Geometry and resolution only; never
  # brightness, because shaded vs direct_sun IS a brightness judgement.
  aug_rotate_deg: 10
  aug_erase_p: 0.25
  aug_blur_p: 0.25
  tta_hflip: false                 # mirror-averaged logits at eval/inference
  # Draw training crops in production's size mix. Measured to HURT (small crops
  # are the noisiest labels); left here because the harness can re-test it.
  size_reweight: false
  cv_folds: 5
  # Score newly-uploaded days automatically, as a pipeline stage after localize.
  # Off by default and independent of the weights file existing: a checkpoint on
  # the box means somebody was evaluating a model, not that arriving footage
  # should be scored by it. Gates the AUTOMATIC path only — `POST
  # /api/attrs/score` is an explicit operator action and works regardless, which
  # is how you score one day, judge the result, and only then turn this on.
  score_on_ingest: false

  # --- the gate ---
  # Below this P(cow) a detection is flagged not-a-cow. High on purpose:
  # wrongly dropping a real animal corrupts the count, which is the product,
  # while keeping a false positive merely fails to improve it.
  cow_threshold: 0.5
  # Whether the REST OF THE APP filters on that flag. Scoring always records its
  # verdict; this decides whether counts, charts, areas and the CSV act on it.
  # Off by default because turning it on moves every historical count in the
  # dashboard. Never-scored rows are counted either way, so both this flag AND a
  # scoring pass have to happen before any number changes.
  gate_enabled: false

finetune:                          # `cownting train` + `eval-detect`
  dataset_dir: data/finetune/dataset
  runs_dir: runs/finetune
  run_name: cownting
  base_weights: yolo11m-seg.pt     # start point; auto-downloads if absent
  weights_out: data/finetune/cownting-seg.pt   # promoted best.pt -> set detect.yolo_weights to this
  epochs: 100
  imgsz: 1280                      # match inference resolution
  batch: 4                         # bump on a bigger GPU
  freeze: 0                        # backbone layers to freeze (0 = full fine-tune)
  patience: 20
  val_fraction: 0.2
  split_by_time_block: true        # keep near-duplicate minutes out of the val set

shade:
  enabled: false                   # Stage 3 (observed-from-imagery); off in this build
  margin_px: 0                     # px a cow's ground point must sit inside a footprint edge to count as sheltering; within it = boundary/uncertain

flags:
  within_camera_tracking: false    # Stage 3 (motion/bouts)
  global_reid: false               # Stage 4 (cross-camera/day identity)
  pose_enabled: false              # Stage 4 (head-down grazing / lameness)

paths:
  artifacts_dir: data/artifacts
  db_path: data/cownting.duckdb
  count_areas: data/count_areas.json  # per-camera count-area polygons; drawn via the camera gear icon
  orthophoto: null                    # path to a top-down site image; backdrop for the count-area map
  panels: data/panels.json            # per-camera + ortho panel footprints (shelter test)
  # Annotations live in their OWN DuckDB file. A re-ingest purges that day's
  # detections from the main DB and deleting a day moves them to the archive, so
  # labels kept in there would be destroyed by routine data management. Nothing in
  # the ingest path ever opens this file.
  labels_db_path: data/labels.duckdb
  backups_dir: data/backups           # weekly label zips land in <backups_dir>/labels/
