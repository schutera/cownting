project: cownting

# On a server deployment cameras are added by UPLOADING video in the dashboard
# (each upload builds its own per-camera config for that day's batch), so the
# static camera list is intentionally empty here.
cameras: []

ingest:
  target_fps: 1.0
  time_bin_seconds: 2.0
  # Time-lapse only (e.g. a Brinno at 1 frame/min -> 60). Leave null for normal
  # real-time video. Uploads read each file's own capture time regardless.
  # Uploaded footage is a 1-frame/minute time-lapse: keep every captured frame
  # (no target_fps subsampling) and space them 60 s apart in real time.
  frame_interval_seconds: 60.0
  save_frames: true

detect:
  backend: yolo
  device: auto                     # -> cpu on this (CPU-only) server
  conf: 0.25
  yolo_weights: yolo11x-seg.pt     # must match the Dockerfile YOLO_WEIGHTS arg
  class_names: [cow]

posture:
  enabled: true
  lying_elongation: 1.9

# --- In-app labeling: the Label page (docs/roadmap/M3_labeling.md) ---
# Unrelated to the Stage-1b `label:` block (the CVAT round-trip), which this server
# does not run. Every key here is a study-design knob: changing one changes what the
# annotators are asked to produce, so change them between labeling rounds, not during.
annotation:
  # How many DIFFERENT annotators should judge each instance. 2, not 1: at a target
  # of 1 the first submission drops the instance out of every other annotator's
  # queue, so nothing is ever judged twice and agreement can never be measured.
  targets_per_instance: 2
  # A slice of the instances gets a deeper target so Fleiss' kappa has a real rater
  # count somewhere. Membership is derived from the instance key itself, so every
  # annotator independently picks the same slice with zero coordination.
  overlap_fraction: 0.20
  overlap_targets: 3
  skip_retire: 3                   # distinct annotators who may skip an instance
                                   # before it stops being served to anyone
  batch_size: 8                    # instances handed out per queue fetch
  max_batch_size: 50               # ceiling on a client-requested batch size
  # Context around the cow, as a fraction of the LONGER bbox side. Sun exposure and
  # lying/standing are read off the surroundings, so a tight crop is unanswerable.
  crop_pad: 0.35
  crop_max_width: 768              # crops are served square, at most this wide
  # The uploaded Brinno footage burns the wall clock into the bottom ~4% of every
  # frame, and time of day is a direct hint at the sun-exposure answer — a visible
  # banner hands the annotator the answer and inflates agreement. Keep this true.
  mask_timestamp_banner: true
  # The cameras look down and the herd crosses the bottom of the frame, so a padded
  # crop of a low cow can be mostly banner. Above this share the crop is refused
  # rather than served as a grey rectangle, which would collect honest "Cannot tell"
  # answers about nothing and contaminate the statistic this feature exists for.
  max_banner_fraction: 0.6
  max_note_chars: 500              # per-annotation free-text note cap

# --- Weekly off-box backup of the annotation store (see DEPLOY.md) ---
# data/labels.duckdb holds the only state on this box that a re-ingest cannot
# rebuild: frames, detections and overlays all come back, annotator hours do not.
#
# Leave this false until COWNTING_DISCORD_WEBHOOK in .env points at a channel chosen
# for it. The zip contains annotator usernames and per-annotator timings, and the
# first run has no watermark so it posts the whole store in one go — the existing
# login-alerts webhook (alerts/webhook.url) is the wrong destination for that.
# With the variable unset the job still zips and rotates locally; it just posts
# nothing. That is a supported state, not a failure.
backup:
  enabled: false
  # A thread ticks every 15 min and asks "has this long passed since the last good
  # run?" — a redeploy therefore doesn't reset the clock, which matters on a box
  # that gets `docker compose up -d --build` more often than once a week.
  every_days: 7
  keep: 8                          # zips kept in <backups_dir>/labels/, pruned by name
  # Discord rejects (rather than truncates) an upload over ~10 MiB, so past this
  # budget the run degrades: full zip -> CSV-only zip -> a message naming the file it
  # kept on disk. All three still count as a run.
  max_upload_bytes: 9500000

flags:
  pose_enabled: false              # pose stage needs transformers+scipy (see requirements)

auth:
  enabled: true
  session_max_age: 43200           # session cookie lifetime, seconds (12h)
  # Flip to true once served over HTTPS (a domain in CADDY_SITE_ADDRESS) so the
  # session cookie is only sent over TLS. Keep false for plain-HTTP (:80) access,
  # otherwise the browser withholds the cookie and login won't stick.
  https_only: true

paths:
  artifacts_dir: data/artifacts
  db_path: data/cownting.duckdb
  archive_db_path: data/cownting_archive.duckdb
  count_areas: data/count_areas.json
  panel_areas: data/panel_areas.json
  orthophoto: data/orthophoto.png                 # set to a top-down site image (under data/) for the AreaMap
  # Annotations live in their OWN DuckDB file. A re-ingest purges that day's
  # detections from the main DB and deleting a day moves them to the archive, so
  # labels kept in there would be destroyed by routine data management. Nothing in
  # the ingest path ever opens this file; it is created empty at boot.
  labels_db_path: data/labels.duckdb
  backups_dir: data/backups                       # weekly label zips in <backups_dir>/labels/
