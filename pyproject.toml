[project]
name = "cownting"
version = "0.1.0"
description = "Offline cow / solar-field analysis pipeline (segmentation + spatial mapping)"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools]
# EXHAUSTIVE: naming `packages` explicitly turns setuptools' auto-discovery
# off, so a subpackage missing from this list is simply not installed. That is
# invisible under the documented `pip install -e .` (an editable install
# resolves the whole source tree through a path hook) and invisible in the
# container (the Dockerfile COPYs the tree instead of installing it) — it
# surfaces only as ModuleNotFoundError at boot on a real `pip install .`.
# tests/test_packaging.py diffs this list against the directories on disk.
packages = [
    "cownting",
    "cownting.detect",
    "cownting.ingest",
    "cownting.eval",
    "cownting.scene",
    "cownting.finetune",
    "cownting.instance_attrs",
]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[project.optional-dependencies]
# Open-vocabulary bootstrap labeler + annotation round-trip (Stage 1b).
# sam2 is not on PyPI — install it separately (see docs/SETUP_WINDOWS.md).
label = ["fiftyone>=1.0", "transformers>=4.41"]
# Fine-tuning uses the core ultralytics dep; this pulls plotting/eval extras.
finetune = ["matplotlib>=3.7"]
# Test-only: fastapi's TestClient (test_api / test_auth) requires httpx. CI
# installs this so the HTTP tests run; not needed in the runtime image.
test = ["httpx>=0.27"]

[project.scripts]
cownting = "cownting.cli:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
